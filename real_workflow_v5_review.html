function stripTask(t,task){return t.startsWith(task)?t.substring(task.length).replace(/^\n+/,""):t;}

function speak(text,lang){
  if(!("speechSynthesis"in window))return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=lang;u.rate=0.8;
  const vs=window.speechSynthesis.getVoices();
  const v=vs.find(v=>v.lang===lang);
  if(v)u.voice=v;
  window.speechSynthesis.speak(u);
}

function speakFullCard(c){
  if(!("speechSynthesis"in window))return;
  window.speechSynthesis.cancel();
  const answer=c.answer||"";
  const exMatch=c.back.match(/Example：(.+?)(?:<br>|$)/);
  const example=exMatch?exMatch[1].replace(/<[^>]+>/g,""):"";
  let full=answer;
  if(example)full+=". "+example;
  speak(full,"en-US");
}

/* Build per-word pronunciation HTML for the answer */
function buildAnswerPron(answer){
  if(!answer)return"";
  const words=answer.split(/\s+/);
  let html='<div class="ans-words">';
  words.forEach(w=>{
    const clean=w.replace(/[,/]/g,"").trim().toLowerCase();
    const wd=wordData[clean];
    if(wd&&wd.level!=="basic"){
      const cls=wd.level;
      html+=`<span class="aw"><span class="aw-top"><span class="aw-word ${cls}">${w}</span><button class="aw-speak" data-lang="en-US" data-text="${clean}">🔊</button></span><span class="aw-ipa ${cls}">${wd.br} <span style="color:#C7C7CC">|</span> ${wd.us}</span></span>`;
    }else{
      html+=`<span class="aw"><span class="aw-top"><span class="aw-word">${w}</span><button class="aw-speak" data-lang="en-US" data-text="${clean}">🔊</button></span></span>`;
    }
  });
  html+="</div>";
  return html;
}

/* Parse back content into sections */
function buildBackHTML(c){
  const answer=c.answer||function(){const m=c.back.match(/Answer：(.+?)(?:<br>|$)/);return m?m[1].trim():"";}();
  const parts=c.back.split(/<br><br>/);
  let html=buildAnswerPron(answer);
  parts.forEach(p=>{
    if(p.startsWith("Example："))html+=`<div class="back-section"><div class="back-label">Example</div><div>${p.replace(/^Example：/,"")}</div></div>`;
    else if(p.startsWith("Usage note："))html+=`<div class="back-section"><div class="back-label">Usage note</div><div>${p.replace(/^Usage note：/,"")}</div></div>`;
    else if(p.startsWith("中文确认："))html+=`<div class="back-section"><div class="back-label">中文确认</div><div>${p.replace(/^中文确认：/,"")}</div></div>`;
  });
  /* Study mode: add 4-dimension learning content */
  if(isStudy()&&c.study){
    const s=c.study;
    /* 1. 中文释义 */
    if(s.meaning)html+=`<div class="study-section"><div class="study-label">📖 中文释义</div><div class="study-content">${s.meaning}</div></div>`;
    /* 2. 相关表达 (collapsible, collapsed by default) */
    if(s.related)html+=`<div class="study-section"><div class="study-label collapsible collapsed" onclick="this.classList.toggle('collapsed')"><span>🔗 相关表达</span><span class="collapse-icon">▼</span></div><div class="collapse-body"><div class="study-content">${s.related}</div></div></div>`;
    /* 3. 适用语境 */
    if(s.context)html+=`<div class="study-section"><div class="study-label">💬 适用语境</div><div class="study-content">${s.context}</div></div>`;
    /* 4. 发散拓展 */
    if(s.expand)html+=`<div class="study-section"><div class="study-label">✨ 发散拓展</div><div class="study-content">${s.expand}</div></div>`;
  }
  return html;
}

    if(isStudy()){
      /* Study mode: filter by date */
      if(state.dateFilter&&state.dateFilter!=="all"&&c.date!==state.dateFilter)return false;
    }else{
      /* Review mode: filter by type and answer type */
      if(state.type!=="all"&&c.type!==state.type)return false;
      if(state.ans!=="all"&&c.answertype!==state.ans)return false;
    }
    return true;
  });
}
function current(){const v=filtered();if(!v.length)return null;if(state.index>=v.length)state.index=v.length-1;if(state.index<0)state.index=0;return v[state.index];}

function isStudy(){return state.mode==="study";}

function updateDateOptions(){
  const dates=[...new Set(state.cards.filter(c=>c.date&&c.status!=="deleted").map(c=>c.date))].sort();
  const sel=$("dateFilter");
  const cur=sel.value;
  sel.innerHTML='<option value="all">All dates</option>'+dates.map(d=>`<option value="${d}">${d}</option>`).join("");
  sel.value=dates.includes(cur)?cur:"all";
}

function render(){
  $("typeFilter").value=state.type;$("ansFilter").value=state.ans;
  const v=filtered(),c=current();
  const study=isStudy();

  /* Toggle mode UI */
  $("modeStudy").classList.toggle("active",study);
  $("modeReview").classList.toggle("active",!study);
  $("reviewStats").classList.toggle("hidden",study);
  $("studyStats").classList.toggle("hidden",!study);
  $("reviewControls").classList.toggle("hidden",study);
  $("studyControls").classList.toggle("hidden",!study);
  $("reviewFilters").classList.toggle("hidden",study);
  $("studyFilters").classList.toggle("hidden",!study);
  $("progressBar").style.display=study?"block":"none";
  $("card").classList.toggle("study-mode",study);

  if(study){
    updateDateOptions();
    $("dateFilter").value=state.dateFilter||"all";
    const studiedCount=state.cards.filter(x=>x.studied).length;
    const totalCount=state.cards.filter(x=>x.status!=="deleted").length;
    $("studied").textContent=studiedCount;
    $("remaining").textContent=totalCount-studiedCount;
    $("studyPos").textContent=c?`${state.index+1}/${v.length}`:"0/0";
    $("progressFill").style.width=(totalCount>0?(studiedCount/totalCount*100):0)+"%";
  }else{
    $("known").textContent=state.cards.filter(x=>x.status==="known").length;
    $("hard").textContent=state.cards.filter(x=>x.status==="hard").length;
    $("deleted").textContent=state.cards.filter(x=>x.status==="deleted").length;
    $("pos").textContent=c?`${state.index+1}/${v.length}`:"0/0";
  }

  if(!c){$("front").textContent="No cards match the current filter";$("backInner").innerHTML="";$("taskBadge").textContent="";$("meta").innerHTML="";return;}
  $("meta").innerHTML=[c.topic,c.type,c.prompt,c.answertype].map((x,i)=>`<span class="tag ${i===0?"gray":i===3?"amber":""}">${x}</span>`).join("");
  $("taskBadge").textContent=c.task;
  $("front").textContent=stripTask(c.front,c.task);
  $("backInner").innerHTML=buildBackHTML(c);

  if(study){
    $("back").classList.add("show");
    $("flip").style.display="none";
    /* Auto-speak answer on card enter */
    setTimeout(()=>speakFullCard(c),300);
  }else{
    $("back").classList.toggle("show",state.flipped);
    $("flip").style.display="block";
    $("flip").textContent=state.flipped?"Hide Answer":"Show Answer";
  }

  $("frontEdit").value=stripTask(c.front,c.task);
  $("backEdit").value=c.back.replace(/<br>/g,"\n");
  save();
}

function move(d){
  const card=$("card");
  card.classList.add("fade");
  setTimeout(()=>{
    state.index+=d;
    if(!isStudy())state.flipped=false;
    render();
    card.classList.remove("fade");
  },180);
}

/* Mode toggle */
$("modeStudy").onclick=()=>{state.mode="study";state.flipped=true;state.index=0;render();};
$("modeReview").onclick=()=>{state.mode="review";state.flipped=false;state.index=0;render();};

$("typeFilter").onchange=e=>{state.type=e.target.value;state.index=0;state.flipped=false;render();};
$("ansFilter").onchange=e=>{state.ans=e.target.value;state.index=0;state.flipped=false;render();};
$("dateFilter").onchange=e=>{state.dateFilter=e.target.value;state.index=0;render();};
$("flip").onclick=()=>{state.flipped=!state.flipped;render();};
$("nextBtn").onclick=()=>move(1);
$("prevBtn").onclick=()=>move(-1);
$("knownBtn").onclick=()=>{const c=current();if(c)c.status="known";move(1);};
$("hardBtn").onclick=()=>{const c=current();if(c)c.status="hard";move(1);};
$("deleteBtn").onclick=()=>{const c=current();if(c)c.status="deleted";state.flipped=false;render();};
$("editBtn").onclick=()=>$("editor").classList.toggle("hidden");
$("saveBtn").onclick=()=>{const c=current();if(!c)return;c.front=$("frontEdit").value.trim();c.back=$("backEdit").value.trim().replace(/\n/g,"<br>");$("editor").classList.add("hidden");render();};

/* Study mode buttons — minimal: prev / read aloud / next */
$("speakAllBtn").onclick=()=>{const c=current();if(c)speakFullCard(c);};
$("studyNextBtn").onclick=()=>move(1);
$("studyPrevBtn").onclick=()=>move(-1);

$("resetBtn").onclick=()=>{localStorage.removeItem(key);state={cards:initialCards.map((c,i)=>({...c,id:i+1,status:"new",studied:false})),index:0,flipped:false,type:"all",ans:"all",dateFilter:"all",mode:"review"};render();};
$("exportBtn").onclick=()=>{
  /* Copy summary for AI learning (Gemini etc.) */
  const topics=[...new Set(state.cards.filter(c=>c.status!=="deleted").map(c=>c.topic))];
  let text="My English learning notes\nPlease help me study these notes one by one, don't skip any:\n\n";
  topics.forEach(topic=>{
    const cards=state.cards.filter(c=>c.topic===topic&&c.status!=="deleted");
    text+=`\n【${topic}】(${cards.length} cards)\n`;
    cards.forEach((c,i)=>{
      const ans=c.answer||"";
      const exM=c.back.match(/Example：(.+?)(?:<br>|$)/);
      const ex=exM?exM[1].replace(/<[^>]+>/g,""):"";
      const cnM=c.back.match(/中文确认：(.+?)(?:<br>|$)/);
      const cn=cnM?cnM[1]:"";
      text+=`${i+1}. ${ans}${cn?" — "+cn:""}${ex?"\n   Example: "+ex:""}\n`;
    });
  });
  navigator.clipboard.writeText(text).then(()=>{
    $("exportBtn").textContent="✓ Copied!";
    setTimeout(()=>{$("exportBtn").textContent="Copy for AI";},2000);
  }).catch(()=>{
    const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);
    $("exportBtn").textContent="✓ Copied!";
    setTimeout(()=>{$("exportBtn").textContent="Copy for AI";},2000);
  });
};

/* Delegate click for speak buttons inside back area */
document.addEventListener("click",e=>{
  if(e.target.classList.contains("aw-speak")){
    speak(e.target.dataset.text,e.target.dataset.lang);
  }
});

/* Preload voices */
if("speechSynthesis"in window){window.speechSynthesis.onvoiceschanged=()=>{};}

/* Register Service Worker for PWA offline support */
if("serviceWorker"in navigator){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}

render();
</script>
</html>
